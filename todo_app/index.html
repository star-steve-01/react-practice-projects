<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- bootstrap cdn links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
      rel="stylesheet" 
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
      crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
      crossorigin="anonymous">
    </script>

    <!-- bootstrap icons cdn link -->
    <link rel="stylesheet" 
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
    <title>Todo App | Task Manager</title>
  </head>
  <body style="overflow-y: scroll;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- loads initial data to localStorage -->
    <script>
      const data = [
        {
          id: 1,
          title: "Today example 1",
          description: "Drink more water",
          datetime: new Date(),
          completed: true,
          tags: ["today", "example", "water"]
        },
        {
          id: 2,
          title: "Today example 2",
          description: "Use Linux more",
          datetime: new Date(),
          completed: false,
          tags: ["today", "example", "linux"]
        },
        {
          id: 3,
          title: "Tomorrow example 2",
          description: "Go grocery shopping",
          datetime: (new Date()).setDate((new Date).getDate() + 1),
          completed: false,
          tags: ["tomorrow", "example", "shopping"]
        },
        {
          id: 4,
          title: "Tomorrow example 2",
          description: "Drink more water again",
          datetime: (new Date()).setDate((new Date).getDate() + 1),
          completed: false,
          tags: ["tomorrow", "example", "water"]
        },
      ];

      if (localStorage.getItem("data") == null) {
        localStorage.setItem("data", JSON.stringify(data));
      }
    </script>
  </body>
</html>
